    #lbImg{

  <!-- ===== 放大/缩放/拖拽脚本（与测试报告同款） ===== -->       <script> (function(){ const dlg = document.getElementById('
  lightbox
    ' );       const img = document.getElementById(' lbImg');       const btnClose = document.getElementById(' lbClos​​e');       const btnIn = document.getElementById(' lbZoomIn');       const btnOut = document.getElementById(' lbZoomOut');       const btnReset = document.getElementById(' lbZoomReset');       const aDownload = document.getElementById(' lbDownload');      让比例 = 1, minScale = 1, maxScale = 6       ;最后触摸 = null;      函数 openLightbox(src){         img.src = src;         aDownload.href = src;         scale = 1; pos = {x：0，y：0}; apply();         dlg.showModal();       }       function closeLightbox(){ dlg.close(); }       function apply(){         img.style.transform = `translate(${pos.x}px, ${pos.y}px) scale(${scale})`;         btnReset.textContent = `${Math.round(scale*100)}%`;       }       function zoom(delta, center){         const prev = scale;         scale = Math.min(maxScale, Math.max(minScale, scale + delta));         if(center && scale !== prev){           const rect = img.getBoundingClientRect();           const cx = center.x - rect.left - rect.width/2 - pos.x;           const cy = center.y - rect.top - rect.height/2 - pos.y;           pos.x -= cx*(scale/prev - 1);           pos.y -= cy*(规模/上一个 - 1);         }        申请（）;       }       // 点击任何带 .zoomable 的图片打开      document.addEventListener(' click', e=>{         const t = e.target.closest('img.zoomable ');         if(!t) return;







































        const full = t.getAttribute('data-full') || t.src;
        openLightbox(full);
      });

      // 关闭与快捷键
      btnClose.addEventListener(' click', closeLightbox);
      dlg.addEventListener(' keydown' , e=>{ if(e.key==='Escape') closeLightbox(); });

      // 拖拽平移
      img.addEventListener(' mousedown', e=>{
        if(scale<=1) return;
        dragStart = {x: e.clientX - pos.x, y: e.clientY - pos.y};
        e.preventDefault();
      });
      window.addEventListener(' mousemove', e=>{
        if(!dragStart) return;
        pos = {x: e.clientX - dragStart.x, y: e.clientY - dragStart.y};
        apply();
      });
      window.addEventListener(' mouseup', ()=> dragStart=null);

      // 滚轮缩放
      img.addEventListener('wheel', e=>{
        e.preventDefault();
        zoom(e.deltaY < 0 ? +0.15 : -0.15, {x:e.clientX, y:e.clientY});
      }, {passive:false});

      // 触摸缩放/拖动（手机端）
      img.addEventListener(' touchstart', e=>{
        if(e.touches.length===1){
          lastTouch = {x:e.touches[0].clientX, y:e.touches[0].clientY};
        }else if(e.touches.length===2){
          lastTouch = {d: dist(e.touches[0], e.touches[1]), scale};
        }
      }, {passive:false});
      img.addEventListener(' touchmove', e=>{
        e.preventDefault();
        if(e.touches.length===1 && scale>1 && lastTouch && lastTouch.x!=null){
          const nx = e.touches[0].clientX, ny = e.touches[0].clientY;
          pos.x += nx - lastTouch.x; pos.y += ny - lastTouch.y;
          lastTouch = {x:nx, y:ny};
          apply();
        }else if(e.touches.length===2 && lastTouch && lastTouch.d){
          const d = dist(e.touches[0], e.touches[1]);
          scale = Math.min(maxScale, Math.max(minScale, lastTouch.scale * (d/lastTouch.d)));
          apply();
        }
      }, {passive:false});
      函数 dist(a,b){ const dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;返回 Math.hypot(dx,dy); }

      // 点击背景关闭（不误关图片/工具栏）
      dlg.addEventListener('click', e=>{
        const insideImg = e.composedPath().includes(img) ;
        const insideBar = e.composedPath().includes( document.querySelector('.lb- toolbar'));
        if(!insideImg && !insideBar) closeLightbox();
      });
    })();
  </script>
