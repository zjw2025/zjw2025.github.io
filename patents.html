<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>专利证书</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background-color: #f4faff;
      font-family: Arial, Helvetica, sans-serif;
      max-width: 1000px;
      margin: auto;
      padding: 2em;
      line-height: 1.7;
      color: #003366;
    }
    h1 {
      text-align: center;
      color: #003366;
      margin: 0 0 16px;
      font-weight: 800;
    }

    /* 顶部图像 */
    .top-img {
      text-align: center;
      margin-bottom: 2em;
    }
    .top-img img {
      width: 80%;
      max-width: 600px;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      cursor: zoom-in;
    }
    .caption { color:#446384; margin:.5em 0 0; }

    /* 专利申请卡 */
    .notice {
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      padding: 1.5em;
      margin: 2em auto;
      max-width: 700px;
      text-align: center;
    }
    .notice h2 {
      color: #003366;
      font-size: 1.4em;
      margin-bottom: 1em;
    }
    .notice p {
      margin: 0.5em 0;
      font-size: 1.1em;
    }
    .notice a {
      background：#cce7ff;
      padding：8px 16px;
      border-radius：6px;
      text-decoration：none;
      color：#003366;
      font-weight：bold;
      display：inline-block;
      margin-top：1em;
      transition：background 0.3s;
    }
    .notice a：hover {
      background：#b3d9ff;
    }

    /* 画廊 */
    .gallery {
      display：flex;
      flex-wrap：wrap;
      gap：20px;
      justify-content：space-between;
    }
    .item {
      width：30%;
      text-align：center;
    }
    .item img {
      width：100%;
      border-radius：6px;
      box-shadow：0 6px 18px rgba(0, 0, 0, 0.12);
      background：#fff;
      cursor：zoom-in;
      过渡：变换 .15s 缓和，框阴影 .15s 缓和；
    }
    .item img：hover {
      transform：translateY（-2px）;
      box-shadow：0 10px 26px rgba（0,0,0，.16）;
    }

    @media（最大宽度：820px）{
      .item{ 宽度：47％; }
    }
    @media（最大宽度：520px）{
      .item{ 宽度：100％; }
      .top-img img{ 宽度：100％; }
    }

    a.back {
      display：inline-block;
      margin-top：2em;
      text-decoration：none;
      background：#cce7ff;
      padding：8px 14px;
      border-radius：6px;
      color：#003366;
      font-weight：700;
    }
    a.back：hover{ background：#b9dcff; }
  </style>
</head>
<body>

  <!-- 专利申请卡 -->
  <div class="notice">
    <h2>已提交的专利申请</h2>
    <p>1. 纺织废料板制造工艺 — 申请号：<strong>2021108973930</strong> </p>
    <p>2.高效环保的海洋塑料废弃物处理系统及其制备方法 — 申请号：<strong>819457</strong></p>
    <a href="patent.pdf" target="_blank">📄查看完整专利列表 (PDF)</a>
  </div>

  <!-- 顶部图片 -->
  <div class="top-img">
    <img class="zoomable" src="1.jpg" data-full="1.jpg" alt="主专利图片" 加载中="lazy">
    <p class="caption">发明专利：一种胶凝材料</p>
  </div>

  <!-- 标题 -->
  <h1>专利证书</h1>

  <!-- 图库 -->
  <div class="gallery">

    <div class="item"><img class="zoomable" src="3.jpg" data-full="3.jpg" alt="专利 3" 加载中="lazy"></div>
    <div class="item"><img class="zoomable" src="4.jpg" data-full="4.jpg" alt="专利 4" 加载中="lazy"></div>
    <div class="item"><img class="zoomable" src="5.jpg" data-full="5.
    : <div class="item"><img class="zoomable" src="6.jpg" data-full="6.jpg" alt="专利 6" load="lazy"></div>
    <div class="item"><img class="zoomable" src="7.jpg" data-full="7.jpg" alt="专利 7" load="lazy"></div>
    <div class="item"><img class="zoomable" src="8.jpg" data-full="8.jpg" alt="专利 8" load="lazy"></div>
    <div class="item"><img class="zoomable" src="9.jpg" data-full="9.jpg" alt="专利 9" load="lazy"></div>

    <div class="item"><img class="zoomable" src="11.jpg" data-full="11.jpg" alt="专利 11" 加载中="lazy"></div>
    <div class="item"><img class="zoomable" src="12.jpg" data-full="12.jpg" alt="专利 12" 加载中="lazy"></div>
    <div class="item"><img class="zoomable" src="13.jpg" data-full="13.jpg" alt="专利 13" 加载中="lazy"></div>
    <div class="item"><img class="zoomable" src="14.jpg" data-full="14.jpg" alt="专利14" 加载中="lazy"></div>
    <div class="item"><img class="zoomable" src="15.jpg" data-full="15.jpg" alt="专利15" 加载中="lazy"></div>
  </div>

  <!-- 其他证书 -->
  <hr style="margin-top:3em;">
  <div style="text-align:center; margin-bottom:2em;">
    <p style="font-weight:bold;">上海合和新材料科技有限公司营业执照</p>
    <img class="zoomable" src="5.1.jpg" data-full="5.1.jpg" style="max-width:500px; border:1px solid #ccc; border-radius:6px; cursor:zoom-in;" alt="营业执照" 加载中="lazy">
  </div>
  <div style="text-align:center; margin-bottom:2em;">
    <p style="font-weight:bold;">中国科学技术部金桥奖证书</p>
    <img class="zoomable" src="5.2.jpg" data-full="5.2.jpg" style="max-width:500px; border:1px solid #ccc; border-radius:6px; cursor:zoom-in;" alt="金桥奖" 加载中="lazy">
  </div>

  <p style="text-align: center;">
    <a class="back" href="index.html">→返回首页</a>
  </p>
</body>
</html>
